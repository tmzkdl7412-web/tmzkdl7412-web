name: Update profile README

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 (KST)
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_recent_repos.py"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update recent repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python .github/scripts/update_recent_repos.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: 최근 저장소 목록 자동 갱신"
          git push
